name: Publish Release & Enable Pages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release title'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  create_release_and_enable_pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          release_name: ${{ github.event.inputs.release_name }}
          draft: false
          prerelease: false

      - name: Enable GitHub Pages for repo (main, root)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            core.info(`Enabling Pages for ${owner}/${repo} on branch main`);
            const response = await github.request('PUT /repos/{owner}/{repo}/pages', {
              owner,
              repo,
              source: {
                branch: 'main',
                path: '/'
              }
            });
            core.info(JSON.stringify(response.data, null, 2));
            return response.data;

      - name: Output Pages URL
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const url = `https://${owner}.github.io/${repo}/`;
            core.setOutput('pages_url', url);
            console.log('Pages URL:', url);
